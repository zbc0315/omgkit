# 闸门,与本地 `harness/gates.sh` 是同一套。
#
# (这里原先写着"四道闸门",而步骤早已加到五步、现在八步 —— 数字写在散文里
#  就会这样掉队。所以现在不写数字:要知道有几道,数下面的 step。
#  根 Cargo.toml 里的 `default-members` 注释栽过同一个跟头。)
#
# 只跑纯 Rust 那几个 crate(工作区的 `default-members`)。omgkit-py 是 cdylib,
# 链接时把 Python 符号欠着,给它建测试可执行文件必然失败 —— 理由写在
# 根 Cargo.toml 里。
#
# 差分测试的**冒烟**基准随仓库入库(入库 baseline 合计 1658 KB),所以 `gates`
# 这个 job 不需要外部实现就能跑。
#
# 先前这里写着"大语料那一档标了 `#[ignore]`" —— 现在只有**要 83 MB 大基准**的
# 那 16 条还标着(`differential_l1/l2_*`),另外 3 条是重导模板的工具。
# 只靠入库语料就能跑的五条已经解禁,默认 `cargo test` 会跑到它们。
#
# 下面还有第二个 job(`external`)**确实要外部实现**:有四条判官是把我们的产物
# 交给 RDKit 反读,基准没法预先烘进仓库(RDKit 读的是我们**当次**画出/嵌出的
# 东西)。它单独一个 job,所以 pip 那一步挂了看得出是环境问题,不是本仓库。
#
# **Cargo.lock 入库**(理由写在 `.gitignore` 里)。先前不入库,于是 CI 每次从头
# 解析依赖 —— 2026-08-20 `arrayref` 的 0.3.5–0.3.9 全部被上游撤版,而 `tiny-skia`
# 要 `^0.3.6`,CI 21 秒就挂在解析上,本地却照常编译。一道会被上游随机打红的闸,
# 和没有闸差不多。

# 本地跑同一套:`bash harness/gates.sh`(那个脚本带 `set -eo pipefail`,
# 而且判据后面不许接管道 —— 先前现敲的临时脚本用 `... | tail -3`,
# `set -e` 只看管道最后一个命令,判据红了脚本照样退出 0。这个坑在开发笔记里记过)。
# **两边不一致时以本文件为准。**

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 报错要能定位,但别把日志刷爆
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 钉的是 stable + rustfmt + clippy,这一步照它装
      - name: 装工具链
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      # 工作区的 lint 配置把 clippy::all 设成 warn,这里升成错 —— 否则警告会积压
      - name: clippy(警告即失败)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --release

      # **`debug_assert!` 在 release 下整段编译掉。** 上面那一步跑的是 release,
      # 于是全工作区 37 处 `debug_assert!`(顺反没感知、规范秩重复、翻转跨分量……)
      # **一次都没有被闸门执行过** —— 守卫写了等于没写。debug 再跑一遍补上这一档,
      # 全工作区约 6 秒。
      #
      # 只跑这一档、不用它替掉 release 那一档:大语料判据在 debug 下慢一个数量级。
      - name: 测试(debug —— 让 debug_assert 真的跑到)
        run: cargo test --workspace

      # rustdoc 的断链等三项在 Cargo.toml 里已是 deny,这一步让它真的跑到。
      # **要带 `--document-private-items`**:不带的话 rustdoc 根本不给私有条目
      # 建档,指向它们的断链一条都报不出来 —— 实测漏过三条(两条指向私有 fn
      # 的新注释、一条函数改名遗留)。
      - name: 文档
        run: cargo doc --workspace --no-deps --document-private-items

      # ---- omgkit-conf 的三个外部判官 ----
      #
      # **闸不进 CI 就不是闸。** 这三条先前只在本地手动跑,于是"光滑化与 RDKit
      # 逐位相同"、"界宽比 1.020"、"特征值对得上 LAPACK"全靠自觉维持 ——
      # 谁都可能在不知情的时候把它们推回去,而 CI 全程绿灯。
      #
      # 跑的是冒烟档(27 个分子,随仓库入库,合计 454 K),全量基准 7.7 M 不入库。
      # 三条里有两条是**逐分子的硬判据**(逐位相同 / 对上 LAPACK / 精确回嵌),
      # 27 个分子照样抓得住错;只有界矩阵那三条统计判据在冒烟档上精度较低,
      # 全量档留给本地 `harness/gates.sh` 之外手动跑。
      - name: 判官:三角光滑化 vs RDKit
        run: cargo run -p omgkit-conf --release --example smooth_oracle -- harness/baseline/smoke.bounds.jsonl

      - name: 判官:界矩阵(三条)
        run: cargo run -p omgkit-conf --release --example bounds_oracle -- harness/baseline/smoke.bounds.jsonl

      - name: 判官:特征分解 vs LAPACK + 精确回嵌
        run: cargo run -p omgkit-conf --release --example eigen_oracle -- harness/baseline/smoke.bounds.jsonl harness/baseline/smoke.gram_eigs.jsonl

      # **头号指标。** 界不可行的分子连嵌入都进不去,直接计入失败,而项目要赢的
      # 就是 RDKit ETKDG 的 0.52%。这一条跑**全语料**(8831 个分子,语料随仓库入库,
      # 全程 0.7 秒)—— 400 个分子的样本量撑不住 0.3% 量级的判据。
      - name: 判官:全语料界可行率(头号指标)
        run: cargo run -p omgkit-conf --release --example feasibility -- harness/corpus/large.smi

      # **通用性难例语料。** large.smi 是药物样分子,在它上面全绿只说明"对药物样
      # 分子成立"。这一份是照着算法的假设挑的:笼状/张力环、超配位、累积双键、
      # 超大环、少见元素、金属、自由基、两性离子 —— 每一类精确攻击一条假设。
      # 一类分子在这里红了,答案必须是**补一行约束表**,不是加一个代码分支;
      # 前两版 omgkit-conf 正是死在后者上(按分子类别切分支,覆盖率停在 14.3%)。
      - name: 判官:难例语料的界可行率(通用性)
        run: cargo run -p omgkit-conf --release --example feasibility -- harness/corpus/hard.smi

      # **自穿。** 精修阶段"力场里放全部 N² 对"这个改动的目的就是防自穿,
      # 而目的必须有判据 —— 否则收益证明不了,也防不住后续改动把它弄丢。
      # 判据分两步且顺序不能反:**先拿真实构象校准检测器**(真实分子里没有自穿,
      # 报出来就是检测器在乱报),再量我们自己嵌出来的坐标。
      - name: 判官:自穿(先校准检测器,再量自己)
        run: cargo run -p omgkit-conf --release --example threading_oracle -- harness/baseline/smoke.bounds.jsonl

      # **端到端。** 前面各条守一段,这一条守**产物**:分子进去、坐标出来,
      # 那组坐标满不满足化学(键长/键角/扭转越界、自穿、手性、耗时)。
      # 精修前后各量一遍 —— 只报"之后"看不出精修有没有在干活。
      - name: 判官:端到端构型(产物好不好)
        run: cargo run -p omgkit-conf --release --example conformer_oracle -- harness/baseline/smoke.chirality.jsonl

      # **三配位立体中心**(亚砜/亚磺酰胺的 S、膦的 P:三根键 + 一对孤对)。
      # 单独一条,因为上面那份基准里一个这样的中心都没有 —— 变异验证过:
      # 把三配位的槽位前两个对调(= 交付全部三配位中心的对映体),
      # 上面那条闸与全部单元测试照样全绿,只有这一条红。
      - name: 判官:三配位立体中心(孤对那一档)
        run: cargo run -p omgkit-conf --release --example conformer_oracle -- harness/baseline/smoke.lonepair.jsonl

      # 手性:槽位约定排错的话**错法整批一致**,正确率不是 0% 就是 100% ——
      # 这种错只能拿真值比,推不出来。真值是真实构象上量出来的有符号体积。
      - name: 判官:手性中心(真值取自真实构象)
        run: cargo run -p omgkit-conf --release --example chiral_oracle -- harness/baseline/smoke.chirality.jsonl

  # ==========================================================================
  # 要外部实现(RDKit)的那四条判官
  # ==========================================================================
  #
  # 上面 `gates` 里的判官都是拿**预先烘好的基准**比,所以不需要装 RDKit。
  # 这四条不一样:它们把**当次**画出来 / 嵌出来 / 写出来的东西交给 RDKit,基准
  # 没法预先烘 —— 产物变了,该拿去反读的就是新产物。
  #
  # 它们先前只在本地手动跑,而其中一条**当时就是红的**:`check_wedge_readback.py`
  # 报"10 个中心画成了对映体",逐个查下去 10 个全是判官自己的下标 bug
  # (`MolFromMolBlock` 默认删掉 SMILES 开头的显式 `[H]`,下标整体错一位)。
  # **一条没人跑的判据,红着也没人知道** —— 这正是它必须进 CI 的理由。
  #
  # # 版本钉在 `harness/requirements.lock` 里,理由写在那个文件里
  #
  # 一句话:**仓库只认一个 RDKit 版本(2025.09.2)** —— `harness/baseline/` 下的
  # 界矩阵/构象基准就是它导的。头一版这里钉的是开发机 `.venv` 恰好装着的
  # 2022.9.5,那等于在仓库里立第二个版本约定。
  #
  # numpy 也钉了:只钉 RDKit 的话 pip 会自己解 numpy,而版本配错会让
  # `_ARRAY_API not found` / SIGSEGV。同样见那个文件。
  #
  # 开发机的 `.venv` 眼下是 2022.09.5,与这里不同。这四条判据**两边喂的是同一个
  # RDKit**(参考侧与读回侧),所以版本变化会对消,判据断的是上限而不是精确计数
  # —— 两版都实测过退 0(2022.09.5 构型一致 498,2025.09.2 是 495,差的 3 个是
  # 参考侧丢了 CIP 码)。判据现在会**打印它跑在哪个版本上**,别靠记。
  external:
    name: 外部实现判官(RDKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: rustup show active-toolchain || rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2

      # **不用 3.9。** 它 2025-10 已经 EOL,`actions/python-versions` 里最新的 3.9
      # 只到 `linux-24.04`,`ubuntu-latest` 往前滚一次这个 job 就没有解释器可用,
      # 而且没有退路。锁里那个 RDKit 的 manylinux 轮子覆盖 cp39–cp314 ——
      # 判据只要 **RDKit** 版本对,不要解释器版本对。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: harness/requirements.lock

      # `--only-binary` 是有意的:源码编译 RDKit 要几十分钟,真发生时应当当场失败
      - name: 装判据依赖(版本全钉在 lock 里)
        # 整条加引号:`:all:` 里的"冒号 + 空格"会被 YAML 当成映射,不引会解析失败
        run: "pip install --only-binary=:all: -r harness/requirements.lock"

      # **入库基准与生成它的脚本脱钩了没有 —— 只比结构,不比数值。**
      #
      # 真发生过、四个月没人看见:`61b8d58` 教会 `dump_chirality.py` 收三配位
      # 立体中心(亚砜的 S、膦的 P),却**没有重导** `smoke.chirality.jsonl`。
      # 入库那份里 247 个中心全是四配位,而当时的脚本导出来是 248 个、其中
      # 8 个三配位 —— 行数一样(150),全部判官照跑照绿,那个提交声称落地的
      # 那一档在主手性判官眼里根本不存在。分母悄悄变小,没有任何红。
      #
      # 为什么只比结构:这些基准的**数值**各钉在各自的 RDKit 版本上
      # (手性那份是 2022.09.5,界那份是 2025.09.2 —— 各自文件头写着为什么),
      # 而 CI 只装得下一个版本,逐字节比会天天红。**结构与版本无关**:
      # 实测同一批脚本在两个版本下结构逐个相同,只有 lonepair 那份的分子数
      # 15 vs 16(值会变,结构不会)。
      #
      # 另一半("结构没变而内容变少")由 `tests/baseline_sizes.rs` 里的
      # `手性基准装了多少中心与顺反也是契约` 守,那条不需要 RDKit。
      - name: 判官:入库基准与生成它的脚本没脱钩(只比结构)
        run: python harness/check_baseline_schema.py

      # 楔形是"试 Up/Down、取反读回来对的那一个"构造出来的,而反读用的就是
      # 我们自己的 `read_chirality` —— 拿它们往返是**空过的**。真正要问的是
      # "别人照着这张图读,读出来是不是同一个分子",那就必须把图交出去。
      #
      # 第二个参数是**同一份语料**:判据拿它核分母。`dump_molblock` 只导出
      # "有楔形或有 unwedged"的分子,所以任何让 depict 整批看不见立体中心的回归
      # 都会让分子从 dump 里消失、每一档跟着变好看 —— 实测空文件进去,
      # 先前那版打印"全部通过"并退 0。
      #
      # 判据后面**不接管道**:`set -e` 遇到管道只看最后一个命令的退出码。
      - name: 判官:楔形反读(别人照着图读出来是不是同一个构型)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p omgkit-depict --release --example dump_molblock -- harness/corpus/large.smi > "$RUNNER_TEMP/blocks.txt"
          python harness/check_wedge_readback.py "$RUNNER_TEMP/blocks.txt" harness/corpus/large.smi

      # 交付的三维坐标满不满足输入 SMILES 指定的每一处立体。完全绕开我们自己的
      # 任何公式,是唯一真正外部的立体化学判据。
      - name: 判官:交付坐标的立体化学(RDKit 从三维坐标读回构型)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p omgkit-conf --release --example dump_conformers -- harness/corpus/large.smi > "$RUNNER_TEMP/ours.jsonl"
          python harness/verify_stereo.py "$RUNNER_TEMP/ours.jsonl" harness/corpus/large.smi

      # 写出的外部裁判:两边各自规范化再比串,与本实现无共谋。
      #
      # **两个方向都要跑。** 规范那一条先前红了很久没人知道 —— `omgkit-io` 的
      # 规范写出丢掉超价原子的方括号(`Cl[I]Cl` → `ClICl`),外部读者按价补氢
      # 读成 `Cl[IH]Cl`,写出来的是另一个分子。全语料 9 条,而按存储顺序那一条
      # 是绿的:两个方向走的是不同的分支,只跑一个等于只守一半。
      #
      # 第二个参数照例是语料,判据拿它核分母。
      # **`--strict` 是必须的。** 不加的话判据会把"尚未写出的立体信息"分桶豁免,
      # 而那个桶是两侧一起抹掉再比的 —— "没写出 E/Z"与"E/Z 写反了"混成一档,
      # 且没有上限。实测把写出器的单键方向符号一律写成 `/`(顺式全写成反式),
      # 不加 `--strict` 时判据打印"仅 双键立体 不同 149 条"然后退 0。
      - name: 判官:SMILES 写出(按存储顺序,严格)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p omgkit-io --release --example write_smiles -- harness/corpus/large.smi > "$RUNNER_TEMP/written.tsv"
          python harness/check_write.py "$RUNNER_TEMP/written.tsv" harness/corpus/large.smi --strict

      - name: 判官:SMILES 写出(规范,严格)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p omgkit-io --release --example write_smiles -- harness/corpus/large.smi --canonical > "$RUNNER_TEMP/canon.tsv"
          python harness/check_write.py "$RUNNER_TEMP/canon.tsv" harness/corpus/large.smi --strict
