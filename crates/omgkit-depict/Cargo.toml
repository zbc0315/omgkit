[package]
name = "omgkit-depict"
description = "2D coordinates and structure drawing for omgkit: SVG with no dependencies, PNG/JPEG behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
omgkit-core = { path = "../omgkit-core", version = "0.0.8" }
# 规范秩:布局的每一处平局都按它打破,这是"同一分子的任何写法给出同一张图"
# 的来源。没有它,坐标就会依赖输入的原子顺序。
omgkit-io = { path = "../omgkit-io", version = "0.0.8" }
# 环感知:稠环系统的划分是环系统布局的前提
omgkit-chem = { path = "../omgkit-chem", version = "0.0.8" }
# **三维图的规范视角要主轴,主轴要对称矩阵的特征分解。**
#
# 本仓已经有一处特征分解(`omgkit_conf::linalg`,循环 Jacobi,判官是 LAPACK)。
# 再为 3×3 写一个专用版就是同一个概念的第二处实现 —— 那正是本仓一直在防的
# 东西:两处迟早在某个病态输入上分岔,而"视角差一点"没有任何一条判据看得见。
#
# 代价是这条箭头方向别扭(绘图依赖构象生成)。它不成环:omgkit-conf 只依赖
# core / chem / io,不认识 depict。发布到 crates.io 时 conf 要排在 depict 之前。
omgkit-conf = { path = "../omgkit-conf", version = "0.0.8" }

# 位图输出是**可选的**。默认构建零外部依赖,只出 SVG。
#
# 版本是按 MSRV 挑的,不是随手取最新:
#   resvg 0.46+ 要 Rust 1.87、image 0.25.10 要 1.88、jpeg-encoder 0.7 要 1.87,
#   全都高过本工作区的 1.75。resvg 0.45.1 声明 1.67.1、jpeg-encoder 0.6.1
#   声明 1.61 —— 所以开了这个 feature 也不必抬 MSRV。
#
# 换新版本前先看它的 rust_version,别只看有没有新功能。
[dependencies.resvg]
version = "0.45"
optional = true
default-features = false
features = ["text", "system-fonts"]

[dependencies.jpeg-encoder]
version = "0.6"
optional = true

[features]
default = []
## 输出 PNG / JPEG。带入 resvg 与 jpeg-encoder 两个依赖。
raster = ["dep:resvg", "dep:jpeg-encoder"]

[lints]
workspace = true

[dev-dependencies]
omgkit-io = { path = "../omgkit-io", version = "0.0.8" }
# 判官读三维图导出的 jsonl
serde_json = "1"

# 判官用的导出。写 jsonl 要 serde_json,那是 dev-dependency,所以声明成
# example 而不是让 `cargo build` 去碰它。
[[example]]
name = "dump_depict3d"
required-features = []

[[example]]
name = "dump_depict2d"
required-features = []

# 这个例子要出 PNG/JPEG,没有 raster feature 就编不过。声明出来,
# 免得默认的 `cargo clippy --all-targets` 因为它而红。
[[example]]
name = "draw"
required-features = ["raster"]

# 三维图的例子同样要出 PNG。
[[example]]
name = "draw3d"
required-features = ["raster"]
