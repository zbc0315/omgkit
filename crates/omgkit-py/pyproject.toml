[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "omgkit"
description = "Cheminformatics toolkit in Rust with Python bindings"
requires-python = ">=3.9"
license = "BSD-3-Clause"
# 分发件里必须带许可证全文(BSD-3 第 1、2 条就是这么要求的),而 PEP 639 的
# 这个字段不许写 `..` —— 只能在包目录下放一份。它与仓库根那份逐字节相同,
# `harness/gates.sh` 建 wheel 之前会比一次,免得两份各自过期。
license-files = ["LICENSE"]
authors = [{ name = "zbc0315" }]
keywords = ["chemistry", "cheminformatics", "smiles", "smarts", "molecule"]
# 版本由 Cargo.toml 提供,不在两处各写一份
dynamic = ["version"]
# PyPI 项目页的正文。不写的话那一页是**空白的** —— 装包的人看不到这是什么。
# 指向仓库根那一份,不另抄一份:抄了就会有两份各自过期。
readme = "../../README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/zbc0315/omgkit"

[tool.maturin]
# 用 abi3 编译:一个 wheel 覆盖 3.9 及以上,不必逐个小版本各编一份
features = ["pyo3/extension-module"]
strip = true
